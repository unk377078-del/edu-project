<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | منصة الامتحانات الإلكترونية</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">📚</div>
    <h1 class="login-title">Exam Platform</h1>
    <p class="login-subtitle">منصة الامتحانات الإلكترونية السحابية</p>

    <form id="login-form">
      <div class="form-group" style="text-align: right;">
        <label class="form-label" for="email">البريد الإلكتروني</label>
        <input
          type="email"
          id="email"
          class="form-control"
          placeholder="name@example.com"
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group" style="text-align: right; margin-bottom: 1.75rem;">
        <label class="form-label" for="password">كلمة المرور</label>
        <input
          type="password"
          id="password"
          class="form-control"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-lg btn-full">
        تسجيل الدخول
      </button>
    </form>


  </div>

  <div id="toast-container" class="toast-container"></div>
  <div id="loading-overlay" class="loading-overlay"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | منصة الامتحانات الإلكترونية</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">📚</div>
    <h1 class="login-title">منصة الامتحانات</h1>
    <p class="login-subtitle">ادخل اسمك ورقم هاتفك لبدء الامتحان فوراً</p>

    <!-- STUDENT LOGIN FORM -->
    <form id="student-login-form" style="margin-top: 1.5rem;">
      <div class="form-group" style="text-align: right;">
        <label class="form-label" for="student-name">اسم الطالب بالكامل *</label>
        <input
          type="text"
          id="student-name"
          class="form-control"
          placeholder="اكتب اسمك الثلاثي أو الرباعي..."
          required
          autocomplete="name"
          autofocus
        >
      </div>

      <div class="form-group" style="text-align: right; margin-bottom: 1.75rem;">
        <label class="form-label" for="student-phone">رقم الهاتف / الموبايل *</label>
        <input
          type="text"
          id="student-phone"
          class="form-control"
          placeholder="مثال: 01012345678"
          required
          dir="ltr"
          style="text-align: right;"
          autocomplete="tel"
        >
      </div>

      <button type="submit" id="student-submit-btn" class="btn btn-primary btn-lg btn-full" style="font-weight: 800;">
        🚀 الدخول إلى منصة الامتحانات
      </button>
    </form>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <div id="loading-overlay" class="loading-overlay"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

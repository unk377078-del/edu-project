<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | منصة الامتحانات الإلكترونية</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">📚</div>
    <h1 class="login-title">Exam Platform</h1>
    <p class="login-subtitle">منصة الامتحانات الإلكترونية السحابية</p>

    <form id="login-form">
      <div class="form-group" style="text-align: right;">
        <label class="form-label" for="email">البريد الإلكتروني</label>
        <input
          type="email"
          id="email"
          class="form-control"
          placeholder="name@example.com"
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group" style="text-align: right; margin-bottom: 1.75rem;">
        <label class="form-label" for="password">كلمة المرور</label>
        <input
          type="password"
          id="password"
          class="form-control"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-lg btn-full">
        تسجيل الدخول
      </button>
    </form>

    <!-- Passwordless Student Entry Section (Shown only if enabled by Admin in settings) -->
    <div id="passwordless-section" style="display: none; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px dashed var(--gray-300);">
      <div style="font-size: 0.875rem; color: var(--gray-600); margin-bottom: 0.75rem; font-weight: 700;">
        ✨ متاح الآن: دخول الطلاب بدون كلمة مرور
      </div>
      <button type="button" class="btn btn-outline-primary btn-full" id="btn-toggle-passwordless">
        🎓 دخول سريع باسم الطالب فقط
      </button>

      <!-- Passwordless Form -->
      <form id="passwordless-form" style="display: none; margin-top: 1rem; text-align: right; background: var(--gray-50); padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--primary-border);">
        <div class="form-group" style="text-align: right;">
          <label class="form-label" for="guest-name">اسم الطالب بالكامل *</label>
          <input
            type="text"
            id="guest-name"
            class="form-control"
            placeholder="مثال: أحمد محمد علي"
            required
          >
        </div>

        <div class="form-group" style="text-align: right;">
          <label class="form-label" for="guest-code">رقم الجلوس أو الكود <span style="font-size: 0.75rem; color: var(--gray-500);">(اختياري)</span></label>
          <input
            type="text"
            id="guest-code"
            class="form-control"
            placeholder="مثال: ST005"
          >
        </div>

        <div class="form-group" style="text-align: right; margin-bottom: 1.25rem;">
          <label class="form-label" for="guest-class">الصف / الشعبة <span style="font-size: 0.75rem; color: var(--gray-500);">(اختياري)</span></label>
          <input
            type="text"
            id="guest-class"
            class="form-control"
            placeholder="مثال: الصف الأول الثانوي"
          >
        </div>

        <button type="submit" id="guest-submit-btn" class="btn btn-success btn-full" style="font-weight: 700;">
          🚀 الدخول وبدء الاختبار
        </button>
      </form>
    </div>


  </div>

  <div id="toast-container" class="toast-container"></div>
  <div id="loading-overlay" class="loading-overlay"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

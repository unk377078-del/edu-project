<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | منصة الامتحانات الإلكترونية</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">📚</div>
    <h1 class="login-title">منصة الامتحانات</h1>
    <p class="login-subtitle">ادخل اسمك ورقم هاتفك لبدء الامتحان فوراً</p>

    <!-- 1. PRIMARY STUDENT LOGIN FORM (NAME + PHONE) -->
    <form id="student-login-form" style="margin-top: 1.5rem;">
      <div class="form-group" style="text-align: right;">
        <label class="form-label" for="student-name">اسم الطالب بالكامل *</label>
        <input
          type="text"
          id="student-name"
          class="form-control"
          placeholder="اكتب اسمك الثلاثي أو الرباعي..."
          required
          autocomplete="name"
          autofocus
        >
      </div>

      <div class="form-group" style="text-align: right; margin-bottom: 1.75rem;">
        <label class="form-label" for="student-phone">رقم الهاتف / الموبايل *</label>
        <input
          type="tel"
          id="student-phone"
          class="form-control"
          placeholder="مثال: 01012345678"
          required
          dir="ltr"
          style="text-align: right;"
          autocomplete="tel"
        >
      </div>

      <button type="submit" id="student-submit-btn" class="btn btn-primary btn-lg btn-full" style="font-weight: 800;">
        🚀 الدخول إلى منصة الامتحانات
      </button>
    </form>

    <!-- 2. DISCRETE ADMIN LOGIN TOGGLE (FOR TEACHER / ADMIN ONLY) -->
    <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px dashed var(--gray-200); text-align: center;">
      <button type="button" id="toggle-admin-btn" class="btn btn-ghost btn-sm" style="color: var(--gray-500); font-size: 0.825rem;">
        👑 تسجيل دخول المشرف / المعلم
      </button>

      <form id="admin-login-form" style="display: none; margin-top: 1rem; text-align: right; background: var(--gray-50); padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--gray-200);">
        <div style="font-weight: 700; color: var(--gray-700); margin-bottom: 0.75rem; font-size: 0.9rem;">
          🔐 تسجيل دخول إدارة المنصة
        </div>
        <div class="form-group" style="text-align: right;">
          <label class="form-label" for="admin-email">البريد الإلكتروني</label>
          <input type="email" id="admin-email" class="form-control" placeholder="admin@exam.com" autocomplete="email">
        </div>
        <div class="form-group" style="text-align: right; margin-bottom: 1.25rem;">
          <label class="form-label" for="admin-password">كلمة المرور</label>
          <input type="password" id="admin-password" class="form-control" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" id="admin-submit-btn" class="btn btn-primary btn-full">
          دخول لوحة التحكم
        </button>
      </form>
    </div>

  </div>

  <div id="toast-container" class="toast-container"></div>
  <div id="loading-overlay" class="loading-overlay"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
